<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YENI JAYA LAUNDRY - Owner Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#f1f5f9;--sidebar:#0f172a;--card:#ffffff;
    --primary:#6366f1;--primary-dark:#4f46e5;--success:#10b981;
    --danger:#ef4444;--warning:#f59e0b;--info:#06b6d4;
    --text:#0f172a;--muted:#64748b;--border:#e2e8f0;
    --shadow:0 4px 20px rgba(15,23,42,.06);--radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',system-ui,sans-serif}
  body{background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
  body.dark{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--border:#334155}
  body.dark .topbar{background:#1e293b;border-color:#334155}
  body.dark .stat-card,body.dark .card{background:#1e293b;border-color:#334155}
  body.dark .table-wrap{background:#1e293b}
  body.dark table th{background:#0f172a;border-color:#334155}
  body.dark table td{border-color:#334155}
  body.dark table tr:hover{background:#334155}
  body.dark input,body.dark select,body.dark textarea{background:#0f172a;color:#f1f5f9;border-color:#334155}
  body.dark .empty-state{background:#1e293b;border-color:#334155}
  body.dark .logo-upload{background:#0f172a;border-color:#334155}
  body.dark .logo-upload:hover{background:#1e293b}

  .login-bg{position:fixed;inset:0;background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#312e81 100%);display:flex;align-items:center;justify-content:center;z-index:1000}
  .login-box{background:#fff;border-radius:24px;padding:40px;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .login-logo{width:80px;height:80px;border-radius:20px;background:linear-gradient(135deg,#6366f1,#06b6d4);display:grid;place-items:center;font-size:40px;margin:0 auto 20px;color:#fff}
  .login-box h1{text-align:center;font-size:22px;font-weight:900;margin-bottom:4px}
  .login-box .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px}
  .login-box input{width:100%;padding:14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;margin-bottom:12px;outline:none}
  .login-box input:focus{border-color:var(--primary)}
  .login-btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px}
  .login-btn:hover{transform:translateY(-1px)}
  .login-error{color:var(--danger);font-size:12px;text-align:center;margin-top:10px;display:none}

  .app{display:grid;grid-template-columns:260px 1fr;height:100vh}
  .sidebar{background:linear-gradient(180deg,#0f172a 0%,#1e293b 100%);color:#fff;display:flex;flex-direction:column;padding:20px 16px;overflow-y:auto}
  .sidebar::-webkit-scrollbar{width:4px}
  .sidebar::-webkit-scrollbar-thumb{background:#334155;border-radius:2px}
  .brand{display:flex;align-items:center;gap:12px;padding:8px 4px 20px;border-bottom:1px solid #334155;margin-bottom:16px}
  .brand-logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#6366f1,#06b6d4);display:grid;place-items:center;font-size:22px;overflow:hidden;flex-shrink:0}
  .brand-logo img{width:100%;height:100%;object-fit:cover}
  .brand-name{font-weight:800;font-size:14px;line-height:1.2}
  .brand-sub{font-size:11px;color:#94a3b8;margin-top:2px}
  
  /* SYNC BUTTON DI ATAS MENU */
  .sync-btn{
    width:100%;padding:12px 14px;border-radius:10px;
    background:linear-gradient(135deg,#10b981,#059669);
    color:#fff;border:none;cursor:pointer;font-size:13px;font-weight:700;
    display:flex;align-items:center;justify-content:center;gap:8px;
    margin-bottom:16px;transition:all .2s;
    box-shadow:0 4px 12px rgba(16,185,129,.3)
  }
  .sync-btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(16,185,129,.4)}
  .sync-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
  .sync-btn .spinner-sm{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;display:none}
  .sync-btn.loading .spinner-sm{display:block}
  .sync-btn.loading .sync-icon{display:none}
  @keyframes spin{to{transform:rotate(360deg)}}

  .section-title{font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:1px;padding:12px 14px 6px}
  .nav{display:flex;flex-direction:column;gap:4px;margin-bottom:16px}
  .nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;color:#cbd5e1;transition:all .2s;border:none;background:transparent;width:100%;text-align:left}
  .nav-item:hover{background:#334155;color:#fff}
  .nav-item.active{background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;box-shadow:0 4px 12px rgba(99,102,241,.4)}
  .nav-item .icon{font-size:16px;width:20px;text-align:center}
  .user-box{margin-top:auto;padding:12px;border-radius:10px;background:#334155;display:flex;align-items:center;gap:10px}
  .user-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#06b6d4);display:grid;place-items:center;font-weight:800;font-size:14px}
  .user-name{font-size:12px;font-weight:700}
  .user-role{font-size:10px;color:#94a3b8}
  .logout-btn{margin-left:auto;background:#ef4444;color:#fff;border:none;border-radius:6px;padding:6px 10px;font-size:10px;font-weight:700;cursor:pointer}

  .main{display:flex;flex-direction:column;overflow:hidden}
  .topbar{background:#fff;padding:14px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:16px;transition:background .3s}
  .topbar h1{font-size:18px;font-weight:800}
  .topbar .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .top-actions{display:flex;gap:10px;align-items:center}
  .chip{padding:8px 14px;border-radius:10px;background:#f8fafc;border:1px solid var(--border);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px}
  .chip:hover{border-color:var(--primary);color:var(--primary)}
  .chip.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
  .clock{font-weight:700;font-size:13px}
  .toggle-switch{position:relative;width:50px;height:26px;background:#cbd5e1;border-radius:999px;cursor:pointer;transition:background .3s}
  .toggle-switch.active{background:var(--primary)}
  .toggle-switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .3s}
  .toggle-switch.active::after{transform:translateX(24px)}

  .content{flex:1;overflow-y:auto;padding:20px 24px}
  .page{display:none;animation:fadeIn .3s ease}
  .page.active{display:block}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
  @media(max-width:1200px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
  .stat-card{background:#fff;padding:20px;border-radius:16px;border:1px solid var(--border);transition:all .2s}
  .stat-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
  .stat-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:12px}
  .stat-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .stat-icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:20px}
  .stat-icon.purple{background:#eef2ff;color:#6366f1}
  .stat-icon.green{background:#ecfdf5;color:#10b981}
  .stat-icon.orange{background:#fffbeb;color:#f59e0b}
  .stat-icon.blue{background:#ecfeff;color:#06b6d4}
  .stat-icon.red{background:#fee2e2;color:#ef4444}
  .stat-value{font-size:24px;font-weight:900;margin-bottom:4px}
  .stat-change{font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px}
  .stat-change.up{color:var(--success)}
  .stat-change.down{color:var(--danger)}

  .card{background:#fff;border-radius:16px;padding:24px;border:1px solid var(--border);margin-bottom:20px}
  .card-title{font-size:16px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .card-title .left{display:flex;align-items:center;gap:10px}
  .charts-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:20px}
  @media(max-width:1200px){.charts-grid{grid-template-columns:1fr}}
  .chart-box{position:relative;height:300px}
  .table-wrap{background:#fff;border-radius:16px;overflow:hidden;border:1px solid var(--border)}
  table{width:100%;border-collapse:collapse}
  table th{background:#f8fafc;padding:12px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border-bottom:1px solid var(--border)}
  table td{padding:12px;font-size:13px;border-bottom:1px solid var(--border)}
  table tr:hover{background:#f8fafc}
  .badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700}
  .badge.lunas{background:#d1fae5;color:#065f46}
  .badge.hutang{background:#fee2e2;color:#991b1b}
  .growth-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  @media(max-width:900px){.growth-grid{grid-template-columns:1fr}}
  .growth-card{background:#fff;padding:20px;border-radius:16px;border:1px solid var(--border)}
  .growth-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .growth-title{font-size:13px;font-weight:700}
  .growth-period{font-size:11px;color:var(--muted)}
  .growth-value{font-size:28px;font-weight:900;margin-bottom:4px}
  .growth-value.up{color:var(--success)}
  .growth-value.down{color:var(--danger)}
  .growth-value.flat{color:var(--muted)}
  .growth-compare{font-size:12px;color:var(--muted)}
  .growth-bar{height:6px;background:#f1f5f9;border-radius:3px;margin-top:10px;overflow:hidden}
  .growth-bar-fill{height:100%;border-radius:3px;transition:width .5s}
  .growth-bar-fill.up{background:var(--success)}
  .growth-bar-fill.down{background:var(--danger)}
  .filter-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .filter-bar input,.filter-bar select{padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;outline:none;background:#fff}
  .filter-bar input:focus,.filter-bar select:focus{border-color:var(--primary)}
  .empty-state{background:#fff;border:2px dashed var(--border);border-radius:16px;padding:60px 20px;text-align:center;color:var(--muted)}
  .empty-state .icon{font-size:60px;margin-bottom:12px;opacity:.5}
  .empty-state h3{font-size:18px;font-weight:700;margin-bottom:8px;color:var(--text)}
  .empty-state p{font-size:13px}

  /* SETTINGS */
  .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:900px){.settings-grid{grid-template-columns:1fr}}
  .form-group{margin-bottom:16px}
  .form-group label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
  .form-group input,.form-group select,.form-group textarea{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;outline:none;transition:all .2s}
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary)}
  .form-group textarea{resize:vertical;min-height:80px;font-family:inherit}
  .logo-upload{border:2px dashed var(--border);border-radius:12px;padding:20px;text-align:center;cursor:pointer;transition:all .2s;background:#fafafa}
  .logo-upload:hover{border-color:var(--primary);background:#eef2ff}
  .logo-upload img{max-width:150px;max-height:100px;margin:0 auto 8px;display:block;border-radius:8px}
  .logo-upload .hint{font-size:12px;color:var(--muted)}
  .btn-save{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--success),var(--success-dark));color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s}
  .btn-save:hover{transform:translateY(-1px)}

  .loading-overlay{position:fixed;inset:0;background:rgba(241,245,249,.9);display:none;align-items:center;justify-content:center;z-index:500;flex-direction:column;gap:12px}
  body.dark .loading-overlay{background:rgba(15,23,42,.9)}
  .spinner{width:50px;height:50px;border:4px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite}
  .loading-text{font-size:14px;font-weight:600;color:var(--muted)}

  .toast{position:fixed;top:20px;right:20px;padding:14px 20px;border-radius:12px;color:#fff;font-weight:600;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:2000;transform:translateX(400px);opacity:0;transition:all .3s ease}
  .toast.show{transform:translateX(0);opacity:1}
  .toast.success{background:var(--success)}
  .toast.error{background:var(--danger)}
  .toast.info{background:var(--primary)}
  .menu-toggle{display:none;background:none;border:none;font-size:22px;cursor:pointer}
  @media(max-width:768px){
    .app{grid-template-columns:1fr}
    .sidebar{position:fixed;left:-280px;top:0;bottom:0;width:260px;z-index:50;transition:left .3s}
    .sidebar.open{left:0}
    .menu-toggle{display:block !important}
  }
</style>
</head>
<body>

<div class="login-bg" id="loginScreen">
  <div class="login-box">
    <div class="login-logo">🧺</div>
    <h1>YENI JAYA LAUNDRY</h1>
    <div class="sub">Owner Dashboard - Login Required</div>
    <input type="text" id="loginUser" placeholder="Username" autocomplete="off" />
    <input type="password" id="loginPin" placeholder="PIN" autocomplete="off" />
    <button class="login-btn" onclick="doLogin()"> Login</button>
    <div class="login-error" id="loginError">Username atau PIN salah!</div>
    <div style="text-align:center;margin-top:16px;font-size:11px;color:var(--muted)">
      Demo: <strong>YENI</strong> / PIN: <strong>111</strong>
    </div>
  </div>
</div>

<div class="app" id="mainApp" style="display:none">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo" id="brandLogo">🧺</div>
      <div>
        <div class="brand-name">YENI JAYA</div>
        <div class="brand-sub">OWNER DASHBOARD</div>
      </div>
    </div>

    <!-- TOMBOL SYNC MANUAL DI ATAS -->
    <button class="sync-btn" id="syncBtn" onclick="manualSync()">
      <span class="spinner-sm"></span>
      <span class="sync-icon"></span>
      <span class="sync-text">Sync dari Google Sheets</span>
    </button>

    <div class="section-title">Overview</div>
    <nav class="nav">
      <button class="nav-item active" data-page="dashboard"><span class="icon"></span>Dashboard</button>
      <button class="nav-item" data-page="sales"><span class="icon">💰</span>Penjualan</button>
    </nav>

    <div class="section-title">Laporan Waktu</div>
    <nav class="nav">
      <button class="nav-item" data-page="hourly"><span class="icon">⏰</span>Per Jam</button>
      <button class="nav-item" data-page="daily"><span class="icon">📅</span>Per Hari</button>
      <button class="nav-item" data-page="weekly"><span class="icon">📆</span>Per Minggu</button>
      <button class="nav-item" data-page="monthly"><span class="icon">🗓️</span>Per Bulan (MTD)</button>
      <button class="nav-item" data-page="yearly"><span class="icon">📊</span>Per Tahun (YTD)</button>
    </nav>

    <div class="section-title">Analisis</div>
    <nav class="nav">
      <button class="nav-item" data-page="growth"><span class="icon">📈</span>Growth Analysis</button>
      <button class="nav-item" data-page="payment"><span class="icon">💳</span>Status Pembayaran</button>
      <button class="nav-item" data-page="customers"><span class="icon">👥</span>Pelanggan</button>
    </nav>

    <div class="section-title">Lainnya</div>
    <nav class="nav">
      <button class="nav-item" data-page="transactions"><span class="icon">🧾</span>Riwayat Transaksi</button>
      <button class="nav-item" data-page="settings"><span class="icon">️</span>Pengaturan</button>
      <button class="nav-item" onclick="downloadFullPDF()"><span class="icon">📄</span>Download PDF</button>
    </nav>

    <div class="user-box">
      <div class="user-avatar">Y</div>
      <div>
        <div class="user-name">YENI</div>
        <div class="user-role">Owner</div>
      </div>
      <button class="logout-btn" onclick="doLogout()">Logout</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <div class="sub" id="pageSub">Data dari Google Sheets</div>
        </div>
      </div>
      <div class="top-actions">
        <div class="chip" style="background:#ecfdf5;color:#065f46;border-color:#10b981">
          <span style="width:8px;height:8px;border-radius:50%;background:#10b981"></span>
          <span id="sheetsStatus">Connected</span>
        </div>
        <button class="chip primary" onclick="downloadFullPDF()">📄 PDF</button>
        <div class="clock" id="clock">--:--</div>
        <div class="toggle-switch" id="themeToggle" onclick="toggleTheme()"></div>
      </div>
    </div>

    <div class="content" id="contentArea"></div>
  </main>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">Memuat data dari Google Sheets...</div>
</div>

<div class="toast" id="toast"></div>

<script>
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbwl1JLQn9iGKWI7LdBD_dBFs7Kj5E39ywp7tuFkp85SfHulFzf7EXVqQDPWvCDRmx0t/exec';
const CREDENTIALS = { username: 'YENI', pin: '111' };

let transactions = [];
let charts = {};
let dataLoaded = false;
let storeSettings = JSON.parse(localStorage.getItem('yj_owner_settings')||'null') || {
  logo: '',
  storeName: 'YENI JAYA LAUNDRY',
  storeAddress: 'KP. CIDOKOM TAMBAK SEREAH, ALPAMART CIKOREK KEC. KIBIN, KAB. SERANG BANTEN - INDONESIA',
  storePhone: '087770434213'
};

function doLogin(){
  const u = document.getElementById('loginUser').value.trim().toUpperCase();
  const p = document.getElementById('loginPin').value.trim();
  if(u === CREDENTIALS.username && p === CREDENTIALS.pin){
    sessionStorage.setItem('yj_owner_logged', '1');
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = 'grid';
    init();
  } else {
    document.getElementById('loginError').style.display = 'block';
    setTimeout(()=>document.getElementById('loginError').style.display='none', 2000);
  }
}
function doLogout(){
  if(confirm('Yakin logout?')){
    sessionStorage.removeItem('yj_owner_logged');
    location.reload();
  }
}
if(sessionStorage.getItem('yj_owner_logged')==='1'){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'grid';
}

async function init(){
  await loadData(false); // false = tampilkan loading hanya pertama kali
  startClock();
  loadTheme();
  loadStoreSettings();
  setupNav();
  renderPage('dashboard');
  // TIDAK ADA AUTO-REFRESH LAGI!
}

async function loadData(showLoading = true){
  if(showLoading) showLoadingOverlay('Memuat data dari Google Sheets...');
  try{
    const res = await fetch(SHEET_URL + '?action=getAll', {
      method: 'GET',
      mode: 'cors',
      cache: 'no-store'
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if(Array.isArray(data)){
      transactions = data.map(parseSheetRow).filter(t=>t && t.total>0);
    } else {
      transactions = [];
    }
    dataLoaded = true;
    document.getElementById('sheetsStatus').textContent = 'Connected';
    hideLoadingOverlay();
    return true;
  }catch(e){
    console.error('Sheets fetch failed:', e);
    transactions = [];
    dataLoaded = true;
    document.getElementById('sheetsStatus').textContent = 'Error';
    hideLoadingOverlay();
    toast('⚠️ Gagal load dari Google Sheets: ' + e.message, 'error');
    return false;
  }
}

// MANUAL SYNC - hanya dipanggil saat klik tombol
async function manualSync(){
  const btn = document.getElementById('syncBtn');
  btn.classList.add('loading');
  btn.disabled = true;
  btn.querySelector('.sync-text').textContent = 'Syncing...';
  
  showLoadingOverlay('Menarik data dari Google Sheets...');
  
  const success = await loadData(false);
  
  btn.classList.remove('loading');
  btn.disabled = false;
  btn.querySelector('.sync-text').textContent = 'Sync dari Google Sheets';
  
  if(success){
    toast('✅ Data berhasil disinkronkan!', 'success');
    const active = document.querySelector('.nav-item.active');
    if(active) renderPage(active.dataset.page);
  } else {
    toast('❌ Gagal sinkronisasi', 'error');
  }
}

function parseSheetRow(row){
  if(!row || !row.id) return null;
  const belumLunas = parseFloat(row.belumLunas)||0;
  const lunas = parseFloat(row.lunas)||0;
  const total = belumLunas + lunas;
  return {
    id: row.id, waktu: row.waktu, nama: row.nama, hp: row.hp,
    kategori: row.kategori, qty: row.qty,
    belumLunas, lunas, total,
    status: lunas>0 ? 'Lunas' : 'Belum Lunas',
    date: parseDate(row.waktu)
  };
}

function parseDate(str){
  if(!str) return new Date();
  const m = str.match(/(\d{2})\/(\d{2})\/(\d{4})[,\s]+(\d{2})\.?(\d{2})/);
  if(m) return new Date(+m[3], +m[2]-1, +m[1], +m[4], +m[5]);
  const d = new Date(str);
  return isNaN(d)?new Date():d;
}

function rp(n){ return 'Rp '+Math.round(n).toLocaleString('id-ID'); }
function fmtDate(d){ return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}); }
function getToday(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function getYesterday(){ const d=getToday(); d.setDate(d.getDate()-1); return d; }
function getWeekStart(d){ const dt=new Date(d); dt.setDate(dt.getDate()-dt.getDay()); dt.setHours(0,0,0,0); return dt; }
function getMonthStart(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function getYearStart(d){ return new Date(d.getFullYear(), 0, 1); }
function growthCalc(current, previous){
  if(previous===0) return { pct: current>0?100:0, abs: current, direction: current>0?'up':'flat' };
  const pct = ((current-previous)/previous)*100;
  return { pct: pct.toFixed(1), abs: current-previous, direction: pct>0?'up':pct<0?'down':'flat' };
}

function showLoadingOverlay(text){

// ============ MONTHLY ============
function renderMonthly(){
  const months = 6;

  const today = new Date();
  for(let i=months-1;i>=0;i--){
    const mStart = new Date(today.getFullYear(), today.getMonth()-i, 1);
    const mEnd = new Date(today.getFullYear(), today.getMonth()-i+1, 1);
    const mTx = transactions.filter(t=>t.date>=mStart && t.date<mEnd);
    monthlyData.push({ label: mStart.toLocaleDateString('id-ID',{month:'long',year:'numeric'}), total: mTx.reduce((s,t)=>s+t.total,0), count: mTx.length });
  }
  const thisMonth = monthlyData[monthlyData.length-1];
  const lastMonth = monthlyData[monthlyData.length-2];
  const growth = growthCalc(thisMonth.total, lastMonth.total);
  const dayOfMonth = today.getDate();
  const lastMonthSamePeriod = transactions.filter(t=>{
    const d = t.date;
    return d.getMonth()===today.getMonth()-1 && d.getFullYear()===today.getFullYear() && d.getDate()<=dayOfMonth;
  }).reduce((s,t)=>s+t.total,0);
  const mtdGrowth = growthCalc(thisMonth.total, lastMonthSamePeriod);
  document.getElementById('contentArea').innerHTML = `
    <div class="stats-grid">

      <div class="stat-card"><div class="stat-head"><div class="stat-label">Bulan Lalu</div><div class="stat-icon blue">📅</div></div><div class="stat-value">${rp(lastMonth.total)}</div><div class="stat-change">${lastMonth.count} transaksi</div></div>
      <div class="stat-card"><div class="stat-head"><div class="stat-label">MTD vs Periode Sama</div><div class="stat-icon green">📊</div></div><div class="stat-value">${rp(lastMonthSamePeriod)}</div><div class="stat-change ${mtdGrowth.direction}">${mtdGrowth.direction==='up'?'▲':mtdGrowth.direction==='down'?'▼':''} ${Math.abs(mtdGrowth.pct)}% growth</div></div>

    <div class="card"><div class="card-title"><div class="left"> Detail Bulanan</div></div>
      <div class="table-wrap"><table>

        <tbody>${monthlyData.slice().reverse().map((m,i,arr)=>{
          const prev = arr[i+1];
          const g = prev?growthCalc(m.total, prev.total):{pct:0,direction:'flat'};
          const daysInMonth = new Date(today.getFullYear(), today.getMonth()-i+1, 0).getDate();
          return `<tr><td><strong>${m.label}</strong></td><td>${m.count}</td><td><strong>${rp(m.total)}</strong></td><td>${rp(m.total/daysInMonth)}</td><td><span class="stat-change ${g.direction}" style="display:inline-flex">${g.direction==='up'?'▲':g.direction==='down'?'▼':'●'} ${Math.abs(g.pct)}%</span></td></tr>`;

// ============ YEARLY ============
function renderYearly(){
  const years = 3;
  const yearlyData = [];
  const today = new Date();
  for(let i=years-1;i>=0;i--){
    const y = today.getFullYear()-i;
    const yStart = new Date(y,0,1);
    const yEnd = new Date(y+1,0,1);
    const yTx = transactions.filter(t=>t.date>=yStart && t.date<yEnd);
    yearlyData.push({ label: y.toString(), total: yTx.reduce((s,t)=>s+t.total,0), count: yTx.length });
  }
  const thisYear = yearlyData[yearlyData.length-1];
  const lastYear = yearlyData[yearlyData.length-2];
  const growth = growthCalc(thisYear.total, lastYear.total);
  const dayOfYear = Math.floor((today - new Date(today.getFullYear(),0,0))/86400000);
  const lastYearSamePeriod = transactions.filter(t=>{
    const d = t.date;
    const doy = Math.floor((d - new Date(d.getFullYear(),0,0))/86400000);
    return d.getFullYear()===today.getFullYear()-1 && doy<=dayOfYear;
  }).reduce((s,t)=>s+t.total,0);
  const ytdGrowth = growthCalc(thisYear.total, lastYearSamePeriod);
  document.getElementById('contentArea').innerHTML = `

      <div class="stat-card"><div class="stat-head"><div class="stat-label">Tahun Lalu</div><div class="stat-icon blue">📅</div></div><div class="stat-value">${rp(lastYear.total)}</div><div class="stat-change">${lastYear.count} transaksi</div></div>

          const prev = arr[i+1];
          const g = prev?growthCalc(y.total, prev.total):{pct:0,direction:'flat'};
          return `<tr><td><strong>${y.label}</strong></td><td>${y.count}</td><td><strong>${rp(y.total)}</strong></td><td>${rp(y.total/12)}</td><td><span class="stat-change ${g.direction}" style="display:inline-flex">${g.direction==='up'?'▲':g.direction==='down'?'▼':'●'} ${Math.abs(g.pct)}%</span></td></tr>`;

// ============ GROWTH ============
function renderGrowth(){
  const today = getToday();
  const yesterday = getYesterday();
  const weekStart = getWeekStart(today);
  const lastWeekStart = new Date(weekStart); lastWeekStart.setDate(lastWeekStart.getDate()-7);
  const monthStart = getMonthStart(today);
  const lastMonthStart = new Date(today.getFullYear(), today.getMonth()-1, 1);
  const yearStart = getYearStart(today);
  const lastYearStart = new Date(today.getFullYear()-1, 0, 1);
  const todayTotal = transactions.filter(t=>t.date>=today).reduce((s,t)=>s+t.total,0);
  const yesterdayTotal = transactions.filter(t=>t.date>=yesterday && t.date<today).reduce((s,t)=>s+t.total,0);
  const thisWeekTotal = transactions.filter(t=>t.date>=weekStart).reduce((s,t)=>s+t.total,0);
  const lastWeekTotal = transactions.filter(t=>t.date>=lastWeekStart && t.date<weekStart).reduce((s,t)=>s+t.total,0);
  const mtdTotal = transactions.filter(t=>t.date>=monthStart).reduce((s,t)=>s+t.total,0);
  const lastMtdTotal = transactions.filter(t=>t.date>=lastMonthStart && t.date<monthStart).reduce((s,t)=>s+t.total,0);
  const ytdTotal = transactions.filter(t=>t.date>=yearStart).reduce((s,t)=>s+t.total,0);
  const lastYtdTotal = transactions.filter(t=>t.date>=lastYearStart && t.date<yearStart).reduce((s,t)=>s+t.total,0);
  const gDaily = growthCalc(todayTotal, yesterdayTotal);
  const gWeekly = growthCalc(thisWeekTotal, lastWeekTotal);
  const gMonthly = growthCalc(mtdTotal, lastMtdTotal);
  const gYearly = growthCalc(ytdTotal, lastYtdTotal);

        <div class="growth-card"><div class="growth-head"><div><div class="growth-title">Bulanan (MTD)</div><div class="growth-period">Bulan ini vs Bulan lalu</div></div><div class="stat-icon blue">🗓️</div></div><div class="growth-value ${gMonthly.direction}">${gMonthly.direction==='up'?'+':''}${gMonthly.pct}%</div><div class="growth-compare">${rp(mtdTotal)} vs ${rp(lastMtdTotal)}</div><div class="growth-bar"><div class="growth-bar-fill ${gMonthly.direction}" style="width:${Math.min(100,Math.abs(gMonthly.pct))}%"></div></div></div>
        <div class="growth-card"><div class="growth-head"><div><div class="growth-title">Tahunan (YTD)</div><div class="growth-period">Tahun ini vs Tahun lalu</div></div><div class="stat-icon orange">📊</div></div><div class="growth-value ${gYearly.direction}">${gYearly.direction==='up'?'+':''}${gYearly.pct}%</div><div class="growth-compare">${rp(ytdTotal)} vs ${rp(lastYtdTotal)}</div><div class="growth-bar"><div class="growth-bar-fill ${gYearly.direction}" style="width:${Math.min(100,Math.abs(gYearly.pct))}%"></div></div></div>

        <div style="padding:10px 0">
          <div style="padding:12px;background:#ecfdf5;border-radius:10px;margin-bottom:10px"><div style="font-size:11px;color:#065f46;font-weight:600">📈 GROWTH (Naik)</div><div style="font-size:18px;font-weight:800;color:#065f46;margin-top:4px">${[gDaily,gWeekly,gMonthly,gYearly].filter(g=>g.direction==='up').length} dari 4 periode</div></div>

  }, 50);

// ============ CUSTOMERS ============
function renderCustomers(){
  const custMap = {};
  transactions.forEach(t=>{
    if(!custMap[t.nama]) custMap[t.nama] = {nama:t.nama, hp:t.hp, count:0, total:0, lastVisit:t.date};
    custMap[t.nama].count++;
    custMap[t.nama].total += t.total;
    if(t.date>custMap[t.nama].lastVisit) custMap[t.nama].lastVisit = t.date;
  });
  const customers = Object.values(custMap).sort((a,b)=>b.total-a.total);
  const totalCust = customers.length;
  const totalRevenue = customers.reduce((s,c)=>s+c.total,0);
  const avgPerCust = totalCust?totalRevenue/totalCust:0;
  const topCust = customers[0];
  document.getElementById('contentArea').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-head"><div class="stat-label">Total Pelanggan</div><div class="stat-icon purple">👥</div></div><div class="stat-value">${totalCust}</div><div class="stat-change">unik</div></div>

        <tbody>${transactions.map(t=>`<tr data-search="${(t.id+t.nama+t.hp+t.kategori).toLowerCase()}" data-status="${t.status}" data-date="${t.date.toISOString().split('T')[0]}"><td><strong>${t.id}</strong></td><td>${t.waktu}</td><td>${t.nama}</td><td>${t.hp}</td><td>${t.kategori}</td><td><strong>${rp(t.total)}</strong></td><td><span class="badge ${t.status==='Lunas'?'lunas':'hutang'}">${t.status}</span></td></tr>`).join('')}</tbody>
      </table></div>
    </div>
  `;
}
function filterTrxTable(){
  const q = document.getElementById('trxSearch').value.toLowerCase();
  const s = document.getElementById('trxFilter').value;
  const from = document.getElementById('trxDateFrom').value;
  const to = document.getElementById('trxDateTo').value;
  document.querySelectorAll('#trxTable tbody tr').forEach(row=>{
    row.style.display = row.dataset.search.includes(q) && (!s || row.dataset.status===s) && (!from || row.dataset.date>=from) && (!to || row.dataset.date<=to)?'':'none';
  });
}

        <h3 style="font-size:16px;font-weight:800;margin-bottom:16px">🏪 Informasi Toko</h3>

        </div>
        <div class="form-group">
          <label>Logo Toko</label>
          <div class="logo-upload" onclick="document.getElementById('logoInput').click()">
            ${storeSettings.logo ? `<img id="logoPreview" src="${storeSettings.logo}" />` : `<img id="logoPreview" style="display:none" />`}

          <div style="font-size:12px;color:var(--muted);margin-bottom:8px">URL Google Sheets API</div>
          <div style="font-size:11px;font-family:'JetBrains Mono',monospace;word-break:break-all;color:var(--primary)">${SHEET_URL}</div>

}

function uploadLogo(e){
  const f = e.target.files[0];
  if(!f) return;
  if(f.size > 2*1024*1024){ toast('⚠️ Ukuran logo maksimal 2MB', 'error'); return; }
  const r = new FileReader();
  r.onload = ev=>{
    storeSettings.logo = ev.target.result;
    const preview = document.getElementById('logoPreview');
    if(preview){
      preview.src = ev.target.result;
      preview.style.display = 'block';
    }
    const hint = document.getElementById('logoHint');
    if(hint) hint.textContent = '📷 Klik untuk ganti logo';
    // Update brand logo di sidebar
    document.getElementById('brandLogo').innerHTML = `<img src="${ev.target.result}">`;
    localStorage.setItem('yj_owner_settings', JSON.stringify(storeSettings));
    toast('✓ Logo berhasil diupload', 'success');
  };
  r.readAsDataURL(f);
}

function removeLogo(){
  if(!confirm('Yakin hapus logo?')) return;
  storeSettings.logo = '';
  localStorage.setItem('yj_owner_settings', JSON.stringify(storeSettings));
  document.getElementById('brandLogo').innerHTML = '🧺';
  renderSettings();
  toast('✓ Logo dihapus', 'success');
}

function saveStoreSettings(){
  storeSettings.storeName = document.getElementById('setStoreName').value.trim();
  storeSettings.storeAddress = document.getElementById('setStoreAddress').value.trim();
  storeSettings.storePhone = document.getElementById('setStorePhone').value.trim();
  localStorage.setItem('yj_owner_settings', JSON.stringify(storeSettings));
  toast('✅ Pengaturan tersimpan', 'success');
}

function loadStoreSettings(){
  if(storeSettings.logo){
    document.getElementById('brandLogo').innerHTML = `<img src="${storeSettings.logo}">`;
  }
}

// ============ UTILS ============
function startClock(){
  const el = document.getElementById('clock');
  const tick = ()=>{
    const now = new Date();
    el.textContent = now.toLocaleTimeString('id-ID')+' | '+now.toLocaleDateString('id-ID',{weekday:'short',day:'2-digit',month:'short'});
  };
  tick(); setInterval(tick,1000);
}
function toggleTheme(){
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  document.getElementById('themeToggle').classList.toggle('active', isDark);
  localStorage.setItem('yj_owner_theme', isDark?'dark':'light');
}
function loadTheme(){
  if(localStorage.getItem('yj_owner_theme')==='dark'){
    document.body.classList.add('dark');
    document.getElementById('themeToggle').classList.add('active');
  }
}
function toast(msg,type='info'){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast '+type+' show';
  clearTimeout(window._toastT);
  window._toastT = setTimeout(()=>t.classList.remove('show'), 3000);
}

document.getElementById('loginPin').addEventListener('keypress', e=>{ if(e.key==='Enter') doLogin(); });
document.getElementById('loginUser').addEventListener('keypress', e=>{ if(e.key==='Enter') document.getElementById('loginPin').focus(); });
</script>
